<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Azhar Al-Sanabel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #050505;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }
    .error-code {
        font-family: 'Playfair Display', serif;
        font-size: 120px;
        font-weight: 700;
        color: #ef4444;
        line-height: 1;
        margin-bottom: 10px;
        text-shadow: 0 0 60px rgba(239, 68, 68, 0.3);
    }
    h1 { font-size: 28px; margin-bottom: 16px; }
    p { color: #737373; font-size: 16px; margin-bottom: 30px; max-width: 400px; }
    a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 32px;
        border-radius: 50px;
        background: #FF9DE2;
        color: #050505;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.3s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255, 157, 226, 0.3); }
    </style>
</head>
<body>
    <div>
        <div class="error-code">500</div>
        <h1>Server Error</h1>
        <p>Something went wrong on our end. Please try again later.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
